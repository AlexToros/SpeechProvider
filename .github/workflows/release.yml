name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Package application
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: zsh scripts/package-macos-app.sh

      - name: Upload application archive
        uses: actions/upload-artifact@v4
        with:
          name: SpeechProvider-macOS-${{ github.ref_name }}
          path: dist/SpeechProvider-macOS-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpeechProvider-macOS-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
